<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Productivity Hauler</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#edf2f7;
    padding:16px;
}

/* CARD */

.rank-card{

    background:white;

    border-radius:28px;

    padding:22px;

    box-shadow:
    0 8px 20px rgba(0,0,0,0.06);
}

/* TITLE */

.rank-title{

    font-size:24px;
    font-weight:bold;

    margin-bottom:20px;

    color:#111827;
}

/* ITEM */

.rank-item{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px 0;

    border-bottom:
    1px solid #ececec;
}

.rank-item:last-child{
    border-bottom:none;
}

/* LEFT */

.rank-left{

    display:flex;
    flex-direction:column;
}

/* NRP */

.rank-nrp{

    font-size:13px;

    color:#777;

    margin-bottom:4px;
}

/* NAME */

.rank-name{

    font-size:18px;

    font-weight:bold;

    color:#111;
}

/* AVG */

.rank-avg{

    font-size:20px;

    font-weight:bold;

    color:#0077c8;
}

/* MOBILE */

@media(max-width:768px){

    .rank-title{
        font-size:21px;
    }

    .rank-name{
        font-size:16px;
    }

    .rank-avg{
        font-size:18px;
    }

}

</style>
</head>

<body>

<!-- CARD -->

<div class="rank-card">

    <div class="rank-title">
        Best Productivity Hauler
    </div>

    <!-- DATA -->

    <div id="ranking-container">

        Loading...

    </div>

</div>

<script>

/* CSV URL */

const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vStBmKto9Q87qPBzQkEf1CMDp-gWcydsbpGMO6y6mlaCXzC6_xMpOoijPyfM91uSJCpOkTolUK2INa5/pub?output=csv";

/* FETCH CSV */

fetch(csvUrl)
.then(response => response.text())

.then(csv => {

    const rows =
    csv.trim().split("\n");

    /* HEADER */

    const headers =
    rows[0].split(",");

    /* DATA */

    let html = "";

    for(let i = 1; i < 6; i++){

        const cols =
        rows[i].split(",");

        /* SESUAIKAN INDEX COLUMN */

        const nrp =
        cols[0];

        const nama =
        cols[1];

        const avg =
        cols[2];

        html += `

        <div class="rank-item">

            <div class="rank-left">

                <div class="rank-nrp">
                    ${nrp}
                </div>

                <div class="rank-name">
                    ${nama}
                </div>

            </div>

            <div class="rank-avg">
                ${avg}
            </div>

        </div>

        `;
    }

    document
    .getElementById("ranking-container")
    .innerHTML = html;

})

.catch(error => {

    document
    .getElementById("ranking-container")
    .innerHTML =
    "Gagal mengambil data.";

});

</script>

</body>
</html>
